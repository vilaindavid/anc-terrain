<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ANC · Éditeur arbre décisionnel v3</title>
<style>
:root{
  --sidebar:#141f2e;--sidebar2:#1e2e42;--sidebar3:#27405a;
  --sidebar-text:#c4d4e8;--sidebar-muted:#5a7a9a;
  --accent:#3b9ede;--accent-h:#5bb0ec;
  --success:#2ecc71;--warning:#f0a500;--danger:#e74c3c;
  --bg:#f4f3ef;--panel:#fff;--border:#ddd;--text:#222;--text-muted:#888;
  --radius:4px;--mono:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:13px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* Import */
#import-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--sidebar)}
.import-box{background:var(--sidebar2);border:2px dashed var(--sidebar3);border-radius:10px;padding:52px 60px;text-align:center;transition:border-color .2s}
.import-box.drag-over{border-color:var(--accent);background:#1a2e42}
.import-title{font-size:22px;font-weight:700;color:#7ec8e3;letter-spacing:.5px;margin-bottom:6px}
.import-sub{font-size:13px;color:var(--sidebar-muted);margin-bottom:28px}
.btn-import{background:var(--accent);color:#fff;border:none;padding:11px 28px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer}
.btn-import:hover{background:var(--accent-h)}
.import-hint{margin-top:14px;font-size:11px;color:#3a5a7a}

/* App layout */
#main-app{display:none;grid-template-rows:44px 1fr;height:100vh}

/* Toolbar */
#toolbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--sidebar);border-bottom:1px solid #0a1520}
.tb-logo{font-weight:700;font-size:14px;color:#7ec8e3;letter-spacing:.5px;flex-shrink:0}
.tb-file{font-size:11px;color:var(--sidebar-muted);margin-left:4px;flex-shrink:0}
.tb-spacer{flex:1}
#tb-stats{font-size:11px;color:var(--sidebar-muted)}
.btn{border:none;padding:5px 12px;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;transition:background .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-xs{padding:2px 6px;font-size:10px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover:not(:disabled){background:var(--accent-h)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){filter:brightness(1.1)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){filter:brightness(1.1)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--sidebar-text)}.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn-warning{background:#e67e00;color:#fff}.btn-warning:hover:not(:disabled){filter:brightness(1.1)}
.btn-secondary{background:#ecf0f1;color:var(--text)}.btn-secondary:hover:not(:disabled){background:#dde1e3}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn-outline:hover:not(:disabled){background:rgba(59,158,222,.08)}
.btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-danger-outline:hover:not(:disabled){background:rgba(231,76,60,.08)}

/* Workspace */
.workspace{display:grid;grid-template-columns:340px 1fr;overflow:hidden}

/* Tree panel */
#tree-panel{background:var(--sidebar);display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #0a1520}
#tree-controls{padding:8px;background:var(--sidebar2);border-bottom:1px solid #0a1520;display:flex;flex-direction:column;gap:6px}
#tree-controls input[type=text]{background:var(--sidebar);border:1px solid var(--sidebar3);color:var(--sidebar-text);padding:6px 8px;border-radius:var(--radius);font-size:12px;width:100%}
#tree-controls input[type=text]::placeholder{color:var(--sidebar-muted)}
#tree-controls select{background:var(--sidebar);border:1px solid var(--sidebar3);color:var(--sidebar-text);padding:5px 6px;border-radius:var(--radius);font-size:11px;flex:1}
#tree-controls input[type=text]:focus,#tree-controls select:focus{outline:none;border-color:var(--accent)}
.ctrl-row{display:flex;gap:6px}

/* Category tabs */
#cat-tabs{display:flex;overflow-x:auto;background:var(--sidebar2);border-bottom:1px solid #0a1520;min-height:30px;flex-shrink:0}
#cat-tabs::-webkit-scrollbar{height:3px}
.cat-tab{padding:5px 10px;cursor:pointer;white-space:nowrap;font-size:11px;font-weight:600;color:var(--sidebar-muted);border:none;background:transparent;border-right:1px solid #0a1520;flex-shrink:0;transition:background .15s}
.cat-tab:hover{background:var(--sidebar3);color:var(--sidebar-text)}
.cat-tab.active{background:var(--sidebar);color:#7ec8e3;border-bottom:2px solid #7ec8e3}

/* Tree nodes */
#tree-container{flex:1;overflow-y:auto}
#tree-container::-webkit-scrollbar{width:4px}
#tree-container::-webkit-scrollbar-thumb{background:var(--sidebar3);border-radius:2px}
.tree-node{display:flex;align-items:center;gap:4px;cursor:grab;color:var(--sidebar-text);min-height:26px;padding-right:6px;border-left:3px solid transparent;transition:background .1s}
.tree-node:hover{background:var(--sidebar2)}
.tree-node.selected{background:var(--sidebar3)!important}
.tree-node.flagged .node-lbl::before{content:'🚩 ';font-size:10px}
.tree-node.modified .node-id{color:var(--warning)!important}
/* Glisser-déposer (déplacer un nœud = changer de parent ; Ctrl+glisser = copier) */
.tree-node.dragging{opacity:.35}
.tree-node.drag-over-valid{outline:2px solid var(--success);outline-offset:-2px;background:rgba(46,204,113,.15)}
.tree-node.drag-over-invalid{outline:2px solid var(--danger);outline-offset:-2px;background:rgba(231,76,60,.12);cursor:no-drop}
.tree-toggle{width:16px;text-align:center;font-size:10px;flex-shrink:0;color:var(--sidebar-muted);user-select:none}
.tbadge{font-size:9px;padding:1px 4px;border-radius:2px;font-weight:700;letter-spacing:.2px;flex-shrink:0;text-transform:uppercase}
.tbadge.t-categorie{background:#5b2d8a;color:#e8d5f5}
.tbadge.t-header{background:#394a5c;color:#aec0d4}
.tbadge.t-critere{background:#1a4b7a;color:#a8d0f0}
.tbadge.t-constat{background:#7a1c1c;color:#f5d0d0}
.tbadge.t-recommandation{background:#1a5c2a;color:#a8e4bb}
.tbadge.t-saisie_valeur{background:#6a1050;color:#f4c2e8}
.node-id{font-family:var(--mono);font-size:10px;color:var(--sidebar-muted);flex-shrink:0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-lbl{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.flag-mark{font-size:10px;flex-shrink:0}
.mod-dot{font-size:9px;color:var(--warning);flex-shrink:0}
.search-header{padding:7px 10px;font-size:11px;color:var(--sidebar-muted);border-bottom:1px solid #0a1520;background:var(--sidebar2)}

/* Editor */
#editor-panel{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#editor-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted);flex-direction:column;gap:12px}
#editor-content{display:none;flex-direction:column;height:100%;overflow:hidden}
#ed-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);border-left:4px solid transparent;flex-shrink:0;flex-wrap:wrap}
.ed-id{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)}
.tag-modified{background:#fff3cd;color:#856404;font-size:10px;font-weight:600;padding:2px 7px;border-radius:2px}
.tag-flagged{background:#fdebd0;color:#a04000;font-size:10px;font-weight:600;padding:2px 7px;border-radius:2px}
.cl-badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:500;border:1px solid transparent}
#ed-breadcrumb{padding:5px 16px;background:#eeecea;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bc-link{color:var(--accent);cursor:pointer}.bc-link:hover{text-decoration:underline}

#ed-form{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#ed-form::-webkit-scrollbar{width:5px}
#ed-form::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flbl{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.fval-mono{font-family:var(--mono);font-size:12px;color:var(--text);padding:6px 8px;background:#f8f7f4;border:1px solid var(--border);border-radius:var(--radius);word-break:break-all}
#ed-form textarea,#ed-form input[type=text],#ed-form select{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;font-family:inherit;font-size:13px;color:var(--text);background:#fff;resize:vertical}
#ed-form textarea:focus,#ed-form input[type=text]:focus,#ed-form select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,158,222,.15)}
.field-hint{font-size:10px;color:var(--text-muted)}
.val-ok{font-size:11px;color:var(--success)}.val-warn{font-size:11px;color:var(--warning)}.val-err{font-size:11px;color:var(--danger)}

/* Children list */
.children-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto}
.child-item{display:flex;align-items:center;gap:5px;padding:4px 6px;background:#f8f7f4;border:1px solid #e5e2db;border-radius:var(--radius);border-left:3px solid transparent;cursor:pointer;transition:background .1s}
.child-item:hover{background:#eef3f8;border-color:var(--accent)}
.reorder-btn{background:transparent;border:1px solid #ccc;border-radius:2px;padding:0 3px;cursor:pointer;font-size:10px;line-height:1.4;color:#888;flex-shrink:0}
.reorder-btn:hover:not(:disabled){background:#e8e8e8;color:#333}
.reorder-btn:disabled{opacity:.3;cursor:not-allowed}
.reorder-col{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.child-id{font-family:var(--mono);font-size:10px;color:var(--text-muted);flex-shrink:0}
.child-lbl{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.child-nav{font-size:11px;color:var(--accent);flex-shrink:0;padding:2px 4px}

/* Subpanels */
.subpanel{border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-top:6px;background:#f8f9fc}
.subpanel-warn{background:#fffbf0;border-color:#f0d080}
.subpanel-success{background:#f0fff4;border-color:#a0d8a0}
.subpanel-danger{background:#fff5f5;border-color:#f0b0b0}
.subpanel-blue{background:#f0f5fb;border-color:#c8dbef}

/* ID rename panel */
#id-rename-panel{margin-top:6px}
#rename-preview{font-size:11px;margin-top:4px}

/* Parent item */
.parent-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#f0f5fb;border:1px solid #c8dbef;border-radius:var(--radius);cursor:pointer}
.parent-item:hover{background:#e4eef8}



/* Legacy */
.legacy-box{background:#f9f9f9;border:1px solid #e0e0e0;border-radius:var(--radius);padding:10px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;color:#555}

/* Review */
.review-active{background:#fef9e7;border:1px solid #f0a500;border-radius:var(--radius);padding:10px}
.divider{border:none;border-top:1px solid var(--border)}

/* Footer */
#ed-footer{padding:10px 16px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
#save-feedback{font-size:11px;color:var(--success);opacity:0;transition:opacity .3s}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
/* Ghost properties */
.ghost-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-top:1px solid #f0d0a0;font-size:11px}
.ghost-key{font-family:var(--mono);font-size:10px;color:#c04;flex-shrink:0;min-width:120px}
.ghost-val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555}
/* Section match badge in search */
.sec-badge{font-size:9px;font-family:var(--mono);color:var(--accent);background:rgba(59,158,222,.1);border:1px solid rgba(59,158,222,.3);border-radius:2px;padding:1px 4px;flex-shrink:0}
/* Flagged view header */
.flagged-header{padding:7px 10px;font-size:11px;border-bottom:1px solid #0a1520;background:#2a1a1a;color:#f4c2a0;display:flex;align-items:center;justify-content:space-between}

/* Balise registry panel */
#balise-panel{display:none;flex-direction:column;overflow:hidden;background:var(--bg)}
#balise-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#balise-toolbar input[type=text]{border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;font-size:12px;background:#fff;font-family:inherit}
#balise-filename{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
#balise-content{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:20px}
.balise-summary{display:flex;gap:18px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.balise-section-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)}
.balise-list{display:flex;flex-direction:column;gap:6px}
.balise-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.balise-row-unofficial{border-color:#f0b0b0}
.balise-row-head{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer}
.balise-row-head:hover{background:#f5f4f0}
.balise-name{font-family:var(--mono);font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.balise-count{font-size:10px;color:var(--text-muted);background:#eee;padding:1px 8px;border-radius:10px;flex-shrink:0}
.balise-count-zero{color:#bbb}
.balise-row-body{border-top:1px solid var(--border);padding:4px 0;background:#fafaf8}
.balise-node-item{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;font-size:12px}
.balise-node-item:hover{background:#eef3f8}
.balise-empty-hint{font-size:12px;color:var(--text-muted);padding:8px 0}
</style>
</head>
<body>

<div id="import-screen">
  <div class="import-box" id="drop-zone">
    <div style="font-size:40px;margin-bottom:16px;opacity:.2;line-height:1">⬡</div>
    <div class="import-title">ANC Tree Editor</div>
    <div class="import-sub">Éditeur d'arbre décisionnel v3</div>
    <button class="btn-import" onclick="openFileWithPicker()">
      📂 Ouvrir tree.json
    </button>
    <div class="import-hint">ou glissez-déposez le fichier ici</div>
  </div>
</div>

<div id="main-app">
  <div id="toolbar">
    <span class="tb-logo">⬡ ANC Tree</span>
    <span class="tb-file" id="tb-file"></span>
    <span class="tb-spacer"></span>
    <span id="tb-stats"></span>
    <button class="btn btn-ghost btn-sm" id="btn-flagged" onclick="toggleFlaggedView()" title="Afficher / masquer les nœuds à revoir">🚩 <span id="flag-count" style="font-size:10px"></span></button>
    <button class="btn btn-ghost btn-sm" id="btn-balises" onclick="toggleBaliseView()" title="Gérer la liste officielle des balises DOCX">🏷️ Balises</button>
    <button class="btn btn-ghost btn-sm" id="btn-undo" disabled onclick="undo()">↩ Annuler</button>
    <button class="btn btn-ghost btn-sm" onclick="openFileWithPicker()" title="Ouvrir un fichier (donne accès à la sauvegarde directe)">📂 Ouvrir</button>
    <button class="btn btn-primary btn-sm" id="btn-save" onclick="saveFile()" title="Enregistrer (écrase le fichier original si ouvert via le bouton Ouvrir)">💾 Enregistrer</button>
    <button class="btn btn-success btn-sm" onclick="saveFileAs()" title="Enregistrer sous un nouveau nom">↓ Enregistrer sous…</button>
  </div>
  <div class="workspace">
    <aside id="tree-panel">
      <div id="tree-controls">
        <input type="text" id="search-input" placeholder="🔍 ID, libellé ou balise…" oninput="doSearch(this.value)">
        <div class="ctrl-row">
          <select id="type-filter" onchange="setTypeFilter(this.value)" style="flex:1">
            <option value="">Tous les types</option>
            <option value="critere">Critère</option>
            <option value="constat">Constat</option>
            <option value="recommandation">Recommandation</option>
            <option value="saisie_valeur">Saisie valeur</option>
            <option value="categorie">Catégorie</option>
            <option value="header">En-tête</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="collapseAll()" title="Tout réduire">⊟</button>
        </div>
      </div>
      <div id="cat-tabs"></div>
      <div id="tree-container"></div>
    </aside>
    <main id="editor-panel">
      <div id="editor-empty">
        <div style="font-size:48px;opacity:.1">⬡</div>
        <div>Sélectionnez un nœud dans l'arbre</div>
        <div style="font-size:11px;color:#bbb">↤ cliquez sur un nœud</div>
      </div>
      <div id="editor-content">
        <div id="ed-header"></div>
        <div id="ed-breadcrumb"></div>
        <div id="ed-form"></div>
        <div id="ed-footer"></div>
      </div>
    </main>
  </div>
  <div id="balise-panel">
    <div id="balise-toolbar">
      <span style="font-weight:700;color:var(--sidebar,#141f2e);font-size:13px">🏷️ Liste officielle des balises DOCX</span>
      <span id="balise-filename">balise_registry.json</span>
      <span class="tb-spacer"></span>
      <input type="text" id="balise-search" placeholder="🔍 filtrer…" oninput="baliseSearchQuery=this.value;renderBalisePanel()" style="width:150px">
      <input type="text" id="new-balise-input" placeholder="nom_de_la_balise" onkeydown="if(event.key==='Enter')addBaliseInline()" style="width:180px">
      <button class="btn btn-success btn-sm" onclick="addBaliseInline()">+ Ajouter</button>
      <button class="btn btn-warning btn-sm" onclick="flagUnofficialBalises()" title="Marquer 'à revoir' tous les nœuds dont la balise n'est pas dans la liste officielle">🚩 Flaguer les non-déclarées</button>
      <button class="btn btn-ghost btn-sm" onclick="openBaliseFile()" title="Charger une liste de balises depuis un fichier JSON">📂 Ouvrir</button>
      <button class="btn btn-primary btn-sm" onclick="saveBaliseFile()" title="Enregistrer (écrase le fichier original si ouvert via le bouton Ouvrir)">💾 Enregistrer</button>
      <button class="btn btn-success btn-sm" onclick="saveBaliseFileAs()" title="Enregistrer sous un nouveau nom">↓ Enregistrer sous…</button>
    </div>
    <div id="balise-content"></div>
  </div>
</div>
<input type="file" id="file-tree" accept=".json" style="display:none" onchange="loadTreeFile(event)">
<input type="file" id="file-balise" accept=".json" style="display:none" onchange="loadBaliseFileFallback(event)">

<script>
// ════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════
const TYPE_LABELS={categorie:'CAT',header:'HDR',critere:'CRIT',constat:'CST',recommandation:'RECO',saisie_valeur:'SAI'};
const VALID_TYPES=['categorie','header','critere','constat','recommandation','saisie_valeur'];

const BALISE_LS_KEY='ancTreeEditor_baliseRegistry';
function initBaliseRegistry(){
  // Priorité : dernière liste utilisée (cache navigateur) > liste REGISTRY historique (amorçage)
  // ATTENTION : le cache est local au navigateur/poste courant, il ne synchronise rien
  // entre plusieurs postes — d'où le badge de source affiché dans le panneau Balises.
  try{
    const cached=localStorage.getItem(BALISE_LS_KEY);
    if(cached){
      const parsed=JSON.parse(cached);
      // Nouveau format : { list, defaultTexts, fallbackText }
      if(parsed&&Array.isArray(parsed.list)&&parsed.list.length){
        baliseRegistry=parsed.list;
        baliseDefaultTexts=(parsed.defaultTexts&&typeof parsed.defaultTexts==='object')?parsed.defaultTexts:{};
        baliseFallbackText=typeof parsed.fallbackText==='string'?parsed.fallbackText:'R.A.S.';
        baliseDisplayBlocks=(parsed.displayBlocks&&typeof parsed.displayBlocks==='object')?parsed.displayBlocks:null;
        baliseSource='cache';return;
      }
      // Ancien format (juste un tableau) — migration douce, pas de textes connus
      if(Array.isArray(parsed)&&parsed.length){
        baliseRegistry=parsed;baliseDefaultTexts={};baliseFallbackText='R.A.S.';baliseDisplayBlocks=null;baliseSource='cache';return;
      }
    }
  }catch(e){}
  baliseRegistry=Object.keys(REGISTRY).sort();
  baliseDefaultTexts={};
  baliseFallbackText='R.A.S.';
  baliseDisplayBlocks=null;
  baliseSource='bootstrap';
}
function persistBaliseRegistryCache(){
  try{localStorage.setItem(BALISE_LS_KEY,JSON.stringify({list:baliseRegistry,defaultTexts:baliseDefaultTexts,fallbackText:baliseFallbackText,displayBlocks:baliseDisplayBlocks}));}catch(e){}
}

function pushHistory(desc){
  undoStack.push({snap:JSON.parse(JSON.stringify(tree)),desc,cat:activeCatId});
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  updateUndoBtn();
}
function undo(){
  if(!undoStack.length)return;
  const e=undoStack.pop();
  tree=e.snap; selectedId=null; pendingChanges={}; isDirty=false; modifiedIds.clear();
  if(e.cat&&tree[e.cat]){
    activeCatId=e.cat;
    document.querySelectorAll('.cat-tab').forEach(t=>t.classList.toggle('active',t.dataset.catId===e.cat));
  }
  expandedIds.clear(); renderTree(); updateStats(); updateUndoBtn();
  document.getElementById('editor-empty').style.display='flex';
  document.getElementById('editor-content').style.display='none';
  showFeedback('↩ Annulé : '+e.desc);
}
function updateUndoBtn(){
  const b=document.getElementById('btn-undo');
  if(!b)return;
  b.disabled=undoStack.length===0;
  b.textContent=undoStack.length?`↩ Annuler (${undoStack.length})`:'↩ Annuler';
}

// CASCADE RENAME
// ════════════════════════════════════════════════
function applyRename(oldPfx,newPfx){
  const mapping={};
  Object.keys(tree).forEach(id=>{
    if(id===oldPfx) mapping[id]=newPfx;
    else if(id.startsWith(oldPfx+'.')||id.startsWith(oldPfx+'__'))
      mapping[id]=newPfx+id.slice(oldPfx.length);
  });
  if(!Object.keys(mapping).length)return mapping;
  const newNodes={};
  Object.entries(mapping).forEach(([old,nw])=>{
    const node=JSON.parse(JSON.stringify(tree[old]));
    node.children=(node.children||[]).map(c=>mapping[c]||c);
    if(node.parentId&&mapping[node.parentId])node.parentId=mapping[node.parentId];
    newNodes[nw]=node;
  });
  Object.keys(mapping).forEach(id=>delete tree[id]);
  Object.assign(tree,newNodes);
  Object.values(tree).forEach(node=>{
    if(node.children){
      let ch=false;
      const nc=node.children.map(c=>{const m=mapping[c];if(m){ch=true;return m;}return c;});
      if(ch)node.children=nc;
    }
    if(node.parentId&&mapping[node.parentId])node.parentId=mapping[node.parentId];
    if(node.exclusionGroup&&mapping[node.exclusionGroup])node.exclusionGroup=mapping[node.exclusionGroup];
  });
  if(selectedId&&mapping[selectedId])selectedId=mapping[selectedId];
  const ne=new Set();expandedIds.forEach(id=>ne.add(mapping[id]||id));expandedIds=ne;
  const nm=new Set();modifiedIds.forEach(id=>nm.add(mapping[id]||id));modifiedIds=nm;
  return mapping;
}

function validateNewId(oldId,newId){
  if(!newId)return 'ID vide';
  if(newId===oldId)return 'Même ID';
  if(/\s/.test(newId))return 'Pas d\'espaces dans un ID';
  // Compute what would be created
  const beingRenamed=new Set(Object.keys(tree).filter(id=>id===oldId||id.startsWith(oldId+'.')||id.startsWith(oldId+'__')));
  const conflicts=Object.keys(tree)
    .filter(id=>id===oldId||id.startsWith(oldId+'.')||id.startsWith(oldId+'__'))
    .map(id=>id===oldId?newId:newId+id.slice(oldId.length))
    .filter(nid=>tree[nid]&&!beingRenamed.has(nid));
  if(conflicts.length)return `Conflit : "${conflicts[0]}" existe déjà`;
  return null;
}

function getAffectedCount(nodeId){
  return Object.keys(tree).filter(id=>id===nodeId||id.startsWith(nodeId+'.')||id.startsWith(nodeId+'__')).length;
}

// REORDER — le renumérotage automatique recalcule les IDs ensuite
// ════════════════════════════════════════════════
function doReorderChild(e,childId,dir){
  e.stopPropagation();
  if(!selectedId||!tree[selectedId])return;
  const arr=tree[selectedId].children;
  const idx=arr.indexOf(childId);
  if(idx<0)return;
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=arr.length)return;
  pushHistory(`Déplacement de ${childId} ${dir>0?'vers le bas':'vers le haut'}`);
  // Simple permutation dans le tableau des enfants : autoRenumberTree()
  // (appelé juste après) recalcule tous les IDs impactés d'après le nouvel
  // ordre — plus besoin de gérer un renommage en cascade ici.
  [arr[idx],arr[swapIdx]]=[arr[swapIdx],arr[idx]];
  autoRenumberTree();
  updateStats();renderTree();renderEditor(selectedId);
}

function suggestChildId(parentId){
  const children=(tree[parentId]?.children)||[];
  let max=0;
  children.forEach(cid=>{
    if(cid.startsWith(parentId+'.')){
      const sfx=cid.slice(parentId.length+1);
      const dot=sfx.indexOf('.');
      const part=dot>=0?sfx.slice(0,dot):sfx;
      const n=parseInt(part);
      if(!isNaN(n)&&n>max)max=n;
    }
  });
  return parentId+'.'+(max+1);
}
